name: Lint and Level 1 Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install simulators
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog verilator g++ make python3

      - name: Lint, level 1 tests, control table check
        run: make ci
