name: Lint and Level 1 Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    container: verilator/verilator:v5.052
    steps:
      - uses: actions/checkout@v4

      - name: Install Icarus
        run: |
          apt-get update -o Acquire::Retries=3
          apt-get install -y --no-install-recommends iverilog python3

      - name: Lint, level 1 tests, control table check
        run: make ci

  isa:
    runs-on: ubuntu-24.04
    container: verilator/verilator:v5.052
    steps:
      - uses: actions/checkout@v4

      - name: Install RISC-V toolchain
        run: |
          apt-get update -o Acquire::Retries=3
          apt-get install -y --no-install-recommends gcc-riscv64-unknown-elf python3 git ca-certificates

      - name: riscv-tests rv32ui
        run: make isa
